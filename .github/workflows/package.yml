name: Publish package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  install:
    uses: ./.github/workflows/install-test.yml
  docker:
    needs: [checks, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e "
            import { readFileSync, accessSync } from 'node:fs';
            const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            if (process.env.GITHUB_REF_NAME !== 'v' + version) throw Error('Tag must match package.json');
            accessSync('docs/releases/v' + version + '.md');"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}`;
            if (context.ref !== `refs/tags/${tag}`) throw new Error('Release tag must match package.json');
            const body = fs.readFileSync(`docs/releases/${tag}.md`, 'utf8');
            let existing;
            try { existing = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }); }
            catch (error) { if (error.status !== 404) throw error; }
            if (existing) core.info('Release already exists; preserving its contents.');
            else await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, name: `Milesight Dashboard ${tag}`, body, draft: false, prerelease: false });
