<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">How a Telegram alert travels</title><desc id="desc">1. A freezer warms above its -18 °C limit. 2. The server checks every uplink and rings the alarm once. 3. Everyone signed in to the Telegram bot gets a message. 4. When the reading returns within limits, a back-to-normal message follows.</desc><rect width="1000" height="400" rx="22" fill="#f3f8f7"/><text x="34" y="40" font-size="12" fill="#177b70" letter-spacing="3">FOLLOW ONE ALERT</text><text x="34" y="74" font-size="27" font-weight="700" fill="#173b42">From a warm freezer to your phone, and back</text><rect x="24" y="96" width="220" height="250" rx="18" fill="#fff" stroke="#c5dad6" stroke-width="1.5"/><circle cx="50" cy="122" r="14" fill="#dff0eb"/><text x="50" y="127" text-anchor="middle" font-size="13" font-weight="800" fill="#166c5d">1</text><text x="72" y="128" font-size="15" font-weight="800" fill="#173b42">The freezer warms up</text><rect x="268" y="96" width="220" height="250" rx="18" fill="#fff" stroke="#c5dad6" stroke-width="1.5"/><circle cx="294" cy="122" r="14" fill="#dff0eb"/><text x="294" y="127" text-anchor="middle" font-size="13" font-weight="800" fill="#166c5d">2</text><text x="316" y="128" font-size="15" font-weight="800" fill="#173b42">The hub notices</text><rect x="512" y="96" width="220" height="250" rx="18" fill="#fff" stroke="#c5dad6" stroke-width="1.5"/><circle cx="538" cy="122" r="14" fill="#dff0eb"/><text x="538" y="127" text-anchor="middle" font-size="13" font-weight="800" fill="#166c5d">3</text><text x="560" y="128" font-size="15" font-weight="800" fill="#173b42">Your phone buzzes</text><rect x="756" y="96" width="220" height="250" rx="18" fill="#fff" stroke="#c5dad6" stroke-width="1.5"/><circle cx="782" cy="122" r="14" fill="#dff0eb"/><text x="782" y="127" text-anchor="middle" font-size="13" font-weight="800" fill="#166c5d">4</text><text x="804" y="128" font-size="15" font-weight="800" fill="#173b42">All good again</text><path d="M248 220 H258" stroke="#173b42" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" fill="none"/><path d="M256 213 L265 220 L256 227" fill="none" stroke="#173b42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 220 H502" stroke="#173b42" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" fill="none"/><path d="M500 213 L509 220 L500 227" fill="none" stroke="#173b42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M736 220 H746" stroke="#173b42" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" fill="none"/><path d="M744 213 L753 220 L744 227" fill="none" stroke="#173b42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 160)"><rect x="0" y="0" width="96" height="120" rx="16" fill="#bfe9f7" stroke="#173b42" stroke-width="3"/><path d="M0 42 H96" stroke="#173b42" stroke-width="3"/><rect x="78" y="12" width="6" height="22" rx="3" fill="#173b42"/><rect x="78" y="52" width="6" height="30" rx="3" fill="#173b42"/><circle cx="30" cy="70" r="6" fill="#fff" stroke="#173b42" stroke-width="2"/><circle cx="31" cy="71" r="2.727272727272727" fill="#173b42"/><circle cx="50" cy="70" r="6" fill="#fff" stroke="#173b42" stroke-width="2"/><circle cx="51" cy="71" r="2.727272727272727" fill="#173b42"/><circle cx="20" cy="84" r="3.5" fill="#ff8fa3" opacity=".55"/><circle cx="60" cy="84" r="3.5" fill="#ff8fa3" opacity=".55"/><path d="M33 93 Q40 87 47 93" fill="none" stroke="#173b42" stroke-width="2.5" stroke-linecap="round"/><path d="M14 54 q-5 8 0 12 q5 -4 0 -12Z" fill="#3fb6e0" stroke="#173b42" stroke-width="1.8"/><path d="M68 60 q-4 7 0 10 q4 -3 0 -10Z" fill="#3fb6e0" stroke="#173b42" stroke-width="1.8"/></g><path d="M150 200 H230" stroke="#e5484d" stroke-width="3" stroke-dasharray="7 5"/><text x="150" y="192" font-size="11" font-weight="700" fill="#e5484d">limit −18 °C</text><rect x="150" y="226" width="62" height="30" rx="8" fill="#e5484d"/><text x="181" y="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">−12 °C</text><text x="40" y="318" font-size="12" fill="#506e71">Every uplink is checked</text><text x="40" y="334" font-size="12" fill="#506e71">against your limits.</text><g transform="translate(300 156)"><rect x="0" y="0" width="92" height="44" rx="10" fill="#1b2336" stroke="#173b42" stroke-width="3"/><rect x="0" y="50" width="92" height="64" rx="10" fill="#1b2336" stroke="#173b42" stroke-width="3"/><circle cx="16" cy="22" r="5" fill="#22c55e"/><circle cx="32" cy="22" r="5" fill="#f59e0b"/><rect x="48" y="18" width="32" height="8" rx="4" fill="#2e3a55"/><circle cx="35" cy="76" r="6" fill="#fff" stroke="#173b42" stroke-width="2"/><circle cx="36" cy="77" r="2.727272727272727" fill="#173b42"/><circle cx="57" cy="76" r="6" fill="#fff" stroke="#173b42" stroke-width="2"/><circle cx="58" cy="77" r="2.727272727272727" fill="#173b42"/><path d="M38 92 Q46 100 54 92" fill="none" stroke="#173b42" stroke-width="2.5" stroke-linecap="round"/></g><g transform="translate(408 150)"><path d="M6 24 C6 8 34 8 34 24 V40 L40 50 H0 L6 40 Z" fill="#ffd166" stroke="#173b42" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="55" r="5" fill="#173b42"/><path d="M44 12 q8 10 0 22 M-6 12 q-8 10 0 22" fill="none" stroke="#173b42" stroke-width="2.5" stroke-linecap="round"/></g><text x="284" y="302" font-size="12" fill="#506e71">One message when it starts.</text><text x="284" y="318" font-size="12" fill="#506e71">Flapping back within 30 min</text><text x="284" y="334" font-size="12" fill="#506e71">stays quiet.</text><g transform="translate(560 146)"><rect x="0" y="0" width="124" height="186" rx="20" fill="#fff" stroke="#173b42" stroke-width="3.5"/><rect x="44" y="9" width="36" height="6" rx="3" fill="#173b42"/><rect x="10" y="30" width="104" height="72" rx="12" fill="#e7f5ff" stroke="#3fb6e0" stroke-width="2"/><path d="M20 52 L28 38 L36 52 Z" fill="#f59e0b" stroke="#173b42" stroke-width="1.6" stroke-linejoin="round"/><text x="28" y="50" text-anchor="middle" font-size="9" font-weight="900" fill="#173b42">!</text><text x="42" y="49" font-size="10.5" font-weight="800" fill="#173b42">Freezer:</text><text x="18" y="68" font-size="10" fill="#173b42">temperature −12</text><text x="18" y="84" font-size="10" fill="#173b42">is above −18</text><rect x="10" y="112" width="104" height="54" rx="12" fill="#eef6f4"/><circle cx="26" cy="128" r="7" fill="#22c55e"/><path d="M22.5 128 l2.5 2.5 l5 -5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="38" y="132" font-size="10" font-weight="800" fill="#173b42">Later:</text><text x="18" y="152" font-size="10" fill="#173b42">back within limits</text></g><g transform="translate(790 160)"><rect x="0" y="0" width="96" height="120" rx="16" fill="#bfe9f7" stroke="#173b42" stroke-width="3"/><path d="M0 42 H96" stroke="#173b42" stroke-width="3"/><rect x="78" y="12" width="6" height="22" rx="3" fill="#173b42"/><rect x="78" y="52" width="6" height="30" rx="3" fill="#173b42"/><circle cx="30" cy="70" r="6" fill="#fff" stroke="#173b42" stroke-width="2"/><circle cx="31" cy="71" r="2.727272727272727" fill="#173b42"/><circle cx="50" cy="70" r="6" fill="#fff" stroke="#173b42" stroke-width="2"/><circle cx="51" cy="71" r="2.727272727272727" fill="#173b42"/><circle cx="20" cy="84" r="3.5" fill="#ff8fa3" opacity=".55"/><circle cx="60" cy="84" r="3.5" fill="#ff8fa3" opacity=".55"/><path d="M32 86 Q40 94 48 86" fill="none" stroke="#173b42" stroke-width="2.5" stroke-linecap="round"/></g><g transform="translate(900 168)"><circle cx="18" cy="18" r="18" fill="#22c55e" stroke="#173b42" stroke-width="3"/><path d="M9 18 l6 6 l12 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="900" y="232" font-size="14" font-weight="800" fill="#166c5d">−19 °C</text><text x="772" y="318" font-size="12" fill="#506e71">Also for leaks, batteries</text><text x="772" y="334" font-size="12" fill="#506e71">under 20% and silent devices.</text><text x="34" y="378" font-size="12.5" fill="#355b53">Alerts go to everyone signed in to your workspace’s Telegram bot. Switch them off in Settings → Alerts &amp; energy.</text></svg>
