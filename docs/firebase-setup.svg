<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Firebase setup in six steps</title><desc id="desc">Create a Firebase project, add credentials, test the connection, save configuration, deploy rules, and restart the dashboard.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b2a4a"/><stop offset="1" stop-color="#105449"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#80cbb9"/></marker></defs>
<rect width="1000" height="470" rx="20" fill="url(#bg)"/>
<text x="40" y="43" fill="#88dfc9" font-size="12" letter-spacing="3">GET CONNECTED</text><text x="40" y="78" fill="#fff" font-size="28" font-weight="700">From first launch to live readings</text>
<g fill="none" stroke="#80cbb9" stroke-width="2" marker-end="url(#arrow)"><path d="M326 176H354"/><path d="M646 176H674"/><path d="M820 236V257H180V276"/><path d="M326 336H354"/><path d="M646 336H674"/></g>
<g fill="#133e4d" stroke="#487989"><rect x="40" y="116" width="286" height="120" rx="12"/><rect x="360" y="116" width="286" height="120" rx="12"/><rect x="680" y="116" width="280" height="120" rx="12"/><rect x="40" y="280" width="286" height="120" rx="12"/><rect x="360" y="280" width="286" height="120" rx="12"/><rect x="680" y="280" width="280" height="120" rx="12"/></g>
<g fill="#88dfc9" font-size="12" font-weight="700"><text x="60" y="144">01 / CREATE</text><text x="380" y="144">02 / CONFIGURE</text><text x="700" y="144">03 / VERIFY</text><text x="60" y="308">04 / SAVE</text><text x="380" y="308">05 / PROTECT</text><text x="700" y="308">06 / START</text></g>
<g fill="#fff" font-size="18" font-weight="700"><text x="60" y="175">Firebase project</text><text x="380" y="175">Open /setup</text><text x="700" y="175">Test connection</text><text x="60" y="339">Save settings</text><text x="380" y="339">Deploy rules</text><text x="700" y="339">Restart &amp; sign in</text></g>
<g fill="#c1d9df" font-size="13"><text x="60" y="200">Create Firestore and enable</text><text x="60" y="219">Email/Password authentication.</text><text x="380" y="200">Enter the setup token, web config,</text><text x="380" y="219">and server credential file path.</text><text x="700" y="200">Check the key, project match,</text><text x="700" y="219">and Firestore read/write access.</text><text x="60" y="364">Configuration stays on the server;</text><text x="60" y="383">the private key stays in its file.</text><text x="380" y="364">Apply firestore.rules to control</text><text x="380" y="383">browser access to workspace data.</text><text x="700" y="364">Create your workspace, then</text><text x="700" y="383">connect the gateway with MQTT.</text></g>
<text x="40" y="439" fill="#b1d4cb" font-size="13">MQTT stays offline until Firebase is configured. Complete setup before connecting a gateway.</text>
</svg>
