<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Where does everything live?</title><desc id="desc">The application container can be replaced; keep your runtime files and cloud data. Linux host. data/ holds configuration,. the service-account file,. and application .env.. Docker container. data/ is mounted as /data.. The app runs without root. and reads saved settings.. Firebase cloud. Firestore stores readings.. Authentication stores users.. Rules protect browser access. Back up local data/ and Compose .env securely. Firestore data needs its own backup or export.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#177b70"/></marker></defs><rect width="1000" height="390" rx="20" fill="#f2f8f5"/><text x="36" y="45" font-size="27" font-weight="700" fill="#193e42">Where does everything live?</text><text x="36" y="78" font-size="14" fill="#486c68">The application container can be replaced; keep your runtime files and cloud data.</text><rect x="36" y="116" width="296" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="64" cy="145" r="13" fill="#dff2e9"/><text x="64" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">1</text><text x="53" y="181" font-size="17" font-weight="700" fill="#193e42">Linux host</text><text x="53" y="207" font-size="13" fill="#486c68">data/ holds configuration,</text><text x="53" y="228" font-size="13" fill="#486c68">the service-account file,</text><text x="53" y="249" font-size="13" fill="#486c68">and application .env.</text><path d="M335 194h13" stroke="#177b70" stroke-width="2" marker-end="url(#arrow)"/><rect x="352" y="116" width="296" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="380" cy="145" r="13" fill="#dff2e9"/><text x="380" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">2</text><text x="369" y="181" font-size="17" font-weight="700" fill="#193e42">Docker container</text><text x="369" y="207" font-size="13" fill="#486c68">data/ is mounted as /data.</text><text x="369" y="228" font-size="13" fill="#486c68">The app runs without root</text><text x="369" y="249" font-size="13" fill="#486c68">and reads saved settings.</text><path d="M651 194h13" stroke="#177b70" stroke-width="2" marker-end="url(#arrow)"/><rect x="668" y="116" width="296" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="696" cy="145" r="13" fill="#dff2e9"/><text x="696" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">3</text><text x="685" y="181" font-size="17" font-weight="700" fill="#193e42">Firebase cloud</text><text x="685" y="207" font-size="13" fill="#486c68">Firestore stores readings.</text><text x="685" y="228" font-size="13" fill="#486c68">Authentication stores users.</text><text x="685" y="249" font-size="13" fill="#486c68">Rules protect browser access.</text><rect x="36" y="300" width="928" height="57" rx="12" fill="#deeee7"/><text x="54" y="334" font-size="13" fill="#215e49">Back up local data/ and Compose .env securely. Firestore data needs its own backup or export.</text></svg>
