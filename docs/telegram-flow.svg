<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">How the Telegram assistant works</title><desc id="desc">Optional: configure a Telegram bot token and Gemini API key in Settings. 1. Ask the bot. A signed-in person. sends a sensor question.. 2. Check access. The server checks session. and workspace membership.. 3. Prepare context. Workspace sensor context. is sent to Gemini.. 4. Send reply. The server returns the. answer through Telegram. Only enable the assistant if you intend to share the selected sensor context with Gemini.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#177b70"/></marker></defs><rect width="1000" height="390" rx="20" fill="#f2f8f5"/><text x="36" y="45" font-size="27" font-weight="700" fill="#193e42">How the Telegram assistant works</text><text x="36" y="78" font-size="14" fill="#486c68">Optional: configure a Telegram bot token and Gemini API key in Settings.</text><rect x="36" y="116" width="217" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="64" cy="145" r="13" fill="#dff2e9"/><text x="64" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">1</text><text x="53" y="181" font-size="17" font-weight="700" fill="#193e42">1. Ask the bot</text><text x="53" y="207" font-size="13" fill="#486c68">A signed-in person</text><text x="53" y="228" font-size="13" fill="#486c68">sends a sensor question.</text><path d="M256 194h13" stroke="#177b70" stroke-width="2" marker-end="url(#arrow)"/><rect x="273" y="116" width="217" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="301" cy="145" r="13" fill="#dff2e9"/><text x="301" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">2</text><text x="290" y="181" font-size="17" font-weight="700" fill="#193e42">2. Check access</text><text x="290" y="207" font-size="13" fill="#486c68">The server checks session</text><text x="290" y="228" font-size="13" fill="#486c68">and workspace membership.</text><path d="M493 194h13" stroke="#177b70" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="116" width="217" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="538" cy="145" r="13" fill="#dff2e9"/><text x="538" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">3</text><text x="527" y="181" font-size="17" font-weight="700" fill="#193e42">3. Prepare context</text><text x="527" y="207" font-size="13" fill="#486c68">Workspace sensor context</text><text x="527" y="228" font-size="13" fill="#486c68">is sent to Gemini.</text><path d="M730 194h13" stroke="#177b70" stroke-width="2" marker-end="url(#arrow)"/><rect x="747" y="116" width="217" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="775" cy="145" r="13" fill="#dff2e9"/><text x="775" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">4</text><text x="764" y="181" font-size="17" font-weight="700" fill="#193e42">4. Send reply</text><text x="764" y="207" font-size="13" fill="#486c68">The server returns the</text><text x="764" y="228" font-size="13" fill="#486c68">answer through Telegram.</text><rect x="36" y="300" width="928" height="57" rx="12" fill="#deeee7"/><text x="54" y="334" font-size="13" fill="#215e49">Only enable the assistant if you intend to share the selected sensor context with Gemini.</text></svg>
