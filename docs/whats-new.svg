<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">What is new in DP Sensor Hub v2.2</title><desc id="desc">Telegram alerts: Leaks, low batteries, silent devices and broken limits ping your phone, and again when fixed. Alert limits: Set “below” and “above” on any chart. Lines, red rings and time-outside show what happened. Full 30-day history: Hourly roll-ups make 7- and 30-day charts complete, with each hour’s low-to-high band. Compare &amp; zoom: Up to four lines in two units. 1 h, 6 h or custom dates. Drag across a chart to zoom. Daily energy &amp; cost: kWh per day for smart plugs, priced with your tariff. Live load and phase balance on top. Weekly pattern: A weekday-by-hour heatmap shows when rooms fill up and when power peaks. Rooms &amp; search: Group sensors by room, search by name or model, filter to Quiet, Silent or Alerts. Wall display: Full screen, big type, no buttons, scrolls on its own. Open the dashboard with #wall. New look, live cues: Dark operations console with a light toggle, a ticking Live badge and status on every card.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b162b"/><stop offset="1" stop-color="#163958"/></linearGradient></defs><rect width="1000" height="760" rx="24" fill="url(#bg)"/><text x="34" y="44" font-size="12" fill="#55e4ce" letter-spacing="3">VERSION 2.2</text><text x="34" y="80" font-size="29" font-weight="700" fill="#f4f8ff">What’s new: nine upgrades in one release</text><rect x="25" y="108" width="300" height="192" rx="18" fill="#f3f8f7" stroke="#2c4a66" stroke-width="2"/><circle cx="87" cy="166" r="50" fill="#dff0eb"/><g transform="translate(40 120)"><rect x="8" y="8" width="44" height="74" rx="9" fill="#fff" stroke="#173b42" stroke-width="3"/><rect x="14" y="20" width="34" height="22" rx="8" fill="#3fb6e0"/><path d="M22 31 L40 25 L35 38 L31 33 Z" fill="#fff"/><rect 