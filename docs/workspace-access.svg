<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Who can access your workspace?</title><desc id="desc">Access is checked on the server and in Firestore rules. Gateway. MQTT username + password. Topic must stay inside. the workspace namespace.. Dashboard owner. Firebase sign-in. Firestore rules limit reads. to the owner workspace.. Telegram member. Invite or existing account. Membership is checked. before sensor questions. These are separate access paths. Membership does not grant the owner dashboard or MQTT credentials.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#177b70"/></marker></defs><rect width="1000" height="390" rx="20" fill="#f2f8f5"/><text x="36" y="45" font-size="27" font-weight="700" fill="#193e42">Who can access your workspace?</text><text x="36" y="78" font-size="14" fill="#486c68">Access is checked on the server and in Firestore rules.</text><rect x="36" y="116" width="296" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="64" cy="145" r="13" fill="#dff2e9"/><text x="64" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">1</text><text x="53" y="181" font-size="17" font-weight="700" fill="#193e42">Gateway</text><text x="53" y="207" font-size="13" fill="#486c68">MQTT username + password</text><text x="53" y="228" font-size="13" fill="#486c68">Topic must stay inside</text><text x="53" y="249" font-size="13" fill="#486c68">the workspace namespace.</text><rect x="352" y="116" width="296" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="380" cy="145" r="13" fill="#dff2e9"/><text x="380" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">2</text><text x="369" y="181" font-size="17" font-weight="700" fill="#193e42">Dashboard owner</text><text x="369" y="207" font-size="13" fill="#486c68">Firebase sign-in</text><text x="369" y="228" font-size="13" fill="#486c68">Firestore rules limit reads</text><text x="369" y="249" font-size="13" fill="#486c68">to the owner workspace.</text><rect x="668" y="116" width="296" height="160" rx="14" fill="#fff" stroke="#c6dcd5"/><circle cx="696" cy="145" r="13" fill="#dff2e9"/><text x="696" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#17684e">3</text><text x="685" y="181" font-size="17" font-weight="700" fill="#193e42">Telegram member</text><text x="685" y="207" font-size="13" fill="#486c68">Invite or existing account</text><text x="685" y="228" font-size="13" fill="#486c68">Membership is checked</text><text x="685" y="249" font-size="13" fill="#486c68">before sensor questions.</text><rect x="36" y="300" width="928" height="57" rx="12" fill="#deeee7"/><text x="54" y="334" font-size="13" fill="#215e49">These are separate access paths. Membership does not grant the owner dashboard or MQTT credentials.</text></svg>
