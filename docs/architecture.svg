    <text x="215" y="243">Commands</text>
    <text x="289" y="377">Downlink</text>
    <text x="650" y="323">Commands</text>
  </g>
  <text x="355" y="400" font-size="12" fill="#475569">Published to MQTT does not confirm sensor execution.</text>
</svg>
